title: 'How Software Survives Failure: An Introduction to Durable Applications'
teaser: Learn how durable applications survive crashes and outages by breaking one
  yourself. Hands-on, no code required.
description: |-
  In these exercises, you'll interact with a simple food delivery application. You'll place an
  order and watch it run through to the end. The catch? At any point, you can pull the rug out
  from under it. Switch off any part of the application (for real), watch the order pause,
  restore it, and watch it recover. Go ahead, try and break it. We dare you.
