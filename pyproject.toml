[project]
name = "edu-why-temporal-exercises"
version = "0.1.0"
description = "The 'How Software Survives Failure' demo: a food-delivery order that survives outages and crashes on Temporal."
requires-python = ">=3.9"
dependencies = [
    "temporalio>=1.7",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/delivery"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
